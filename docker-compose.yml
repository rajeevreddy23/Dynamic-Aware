version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: eatsched-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEVICE=cpu
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./results:/app/results:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: eatsched-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
