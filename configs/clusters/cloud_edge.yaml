name: cloud_edge
num_servers: 48
arrival_rate: 0.7
time_limit: 1024.0
max_decision_steps: 1024
max_tasks_per_episode: 32
servers:
  homogenous: false
  groups:
    - count: 32
      speed: 1.0
      power_idle_watts: 80.0
      power_busy_watts: 250.0
      tier: edge
      wan_latency_s: 0.0
    - count: 16
      speed: 2.5
      power_idle_watts: 150.0
      power_busy_watts: 450.0
      tier: cloud
      wan_latency_s: 0.120 # 120ms round-trip
queue:
  top_l: 8
  c_distribution: [0.25, 0.25, 0.25, 0.25]
init_delay:
  cold_start_s: 30.0
  reconfig_s: 1.76
  reuse_s: 0.0
